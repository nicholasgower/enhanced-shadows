[mod-name]
title=Enhanced Shadows

[mod-description]
description=Zastępuje powszechnie używane zasoby zawierające wbudowane cienie wersjami z oddzielonymi cieniami.

[mod-setting-name]
enhanced-shadows-separate-shadows=Oddziel cienie od sprite'ów
enhanced-shadows-change-planet-shadow-opacity=Zmień krycie cieni innych planet


[mod-setting-description]
enhanced-shadows-separate-shadows=Zastępuje niektóre standardowe sprite'y bez oddzielnej warstwy cienia (np. rury) wielowarstwowymi sprite'ami zawierającymi warstwę pierwszego planu i warstwę cienia. Poprawia wygląd ulepszonych cieni, ale może powodować problemy z kompatybilnością.
enhanced-shadows-change-planet-shadow-opacity=Zmienia krycie cieni na innych planetach, aby lepiej odzwierciedlało poziomy rozpraszania światła w atmosferze, które wynikałyby z panującego tam ciśnienia.
